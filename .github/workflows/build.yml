name: Build Windows app

# Every push to main builds and tests the program (download it from the run's
# "Artifacts"). Publishing a GitHub Release (Releases -> Draft a new release ->
# new tag v<APP_VERSION from dvr_core.py>, e.g. v1.4.0 -> Publish) builds it again and
# attaches to the release (<ver> = the program's version):
#   FPV-DVR-Stitcher-<ver>.exe          single file, FFmpeg built in - just run it
#                                       (downloads the AI add-on the first time AI is used)
#   FPV-DVR-Stitcher-<ver>-windows.zip  same program + FFmpeg + AI add-on as separate files
#   FPV-DVR-Stitcher-<ver>-AI-addon.zip Real-ESRGAN upscaler + RIFE frame interpolation
#   model-<name>.onnx             clean-up and extra upscaling models (converted from the
#                                 originals by the "models" job; downloaded by the app when used)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # needed to attach the downloads to a Release

jobs:
  models:
    # Convert the clean-up / upscaling models (models.CATALOG) from PyTorch to ONNX.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache converted models
        id: cache
        uses: actions/cache@v4
        with:
          path: models_out
          key: models-${{ hashFiles('models.py', 'tools/convert_models.py') }}

      - uses: actions/setup-python@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Convert models
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install spandrel onnx onnxconverter-common onnxruntime numpy
          python tools/convert_models.py models_out
          rm -rf models_out/_src

      - name: List models
        run: ls -la models_out

      - uses: actions/upload-artifact@v5
        with:
          name: FPV-DVR-Stitcher-models
          path: models_out/

      - name: Attach models to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" models_out/* --clobber --repo "${{ github.repository }}"

  build:
    needs: models
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller onnx

      - name: Program version
        run: |
          $v = python -c "import dvr_core; print(dvr_core.APP_VERSION)"
          "VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Version $v"
          if ("${{ github.event_name }}" -eq "release" -and "${{ github.event.release.tag_name }}" -ne "v$v") {
            throw "The release tag ${{ github.event.release.tag_name }} does not match the program's version v$v (APP_VERSION in dvr_core.py)."
          }

      - name: Download FFmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip' -OutFile ffmpeg_dl.zip
          Expand-Archive ffmpeg_dl.zip -DestinationPath ffmpeg_dl
          $exe = Get-ChildItem -Recurse ffmpeg_dl -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item $exe.FullName, (Join-Path $exe.DirectoryName 'ffprobe.exe') ffmpeg
          $lic = Get-ChildItem -Recurse ffmpeg_dl -Filter 'LICENSE*' | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName 'ffmpeg\FFMPEG-LICENSE.txt' }
          .\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Cache AI tool downloads
        uses: actions/cache@v4
        with:
          path: ai_dl
          key: ai-upstream-realesrgan-20220424-rife-20221029

      - name: Assemble AI add-on (Real-ESRGAN + RIFE)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force ai_dl | Out-Null
          if (-not (Test-Path 'ai_dl\realesrgan.zip')) {
            Invoke-WebRequest 'https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip' -OutFile 'ai_dl\realesrgan.zip'
          }
          if (-not (Test-Path 'ai_dl\rife.zip')) {
            Invoke-WebRequest 'https://github.com/nihui/rife-ncnn-vulkan/releases/download/20221029/rife-ncnn-vulkan-20221029-windows.zip' -OutFile 'ai_dl\rife.zip'
          }
          Expand-Archive 'ai_dl\realesrgan.zip' -DestinationPath 'ai_x\realesrgan' -Force
          Expand-Archive 'ai_dl\rife.zip' -DestinationPath 'ai_x\rife' -Force
          # only the two programs and the models the app uses
          $e = (Get-ChildItem -Recurse 'ai_x\realesrgan' -Filter realesrgan-ncnn-vulkan.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force 'ai\realesrgan\models' | Out-Null
          Copy-Item "$e\realesrgan-ncnn-vulkan.exe" 'ai\realesrgan'
          Get-ChildItem $e -Filter *.dll | Copy-Item -Destination 'ai\realesrgan'
          foreach ($m in 'realesrgan-x4plus', 'realesr-animevideov3-x4') {
            Copy-Item "$e\models\$m.param", "$e\models\$m.bin" 'ai\realesrgan\models'
          }
          $r = (Get-ChildItem -Recurse 'ai_x\rife' -Filter rife-ncnn-vulkan.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force 'ai\rife' | Out-Null
          Copy-Item "$r\rife-ncnn-vulkan.exe" 'ai\rife'
          Get-ChildItem $r -Filter *.dll | Copy-Item -Destination 'ai\rife'
          Copy-Item "$r\rife-v4.6" 'ai\rife' -Recurse
          if (Test-Path "$r\LICENSE") { Copy-Item "$r\LICENSE" 'ai\rife\LICENSE.txt' }
          Set-Content 'ai\NOTICE.txt' -Value @(
            'AI add-on for FPV DVR Stitcher',
            '',
            'realesrgan-ncnn-vulkan - Real-ESRGAN upscaler (BSD-3-Clause) - https://github.com/xinntao/Real-ESRGAN',
            'rife-ncnn-vulkan - RIFE frame interpolation (MIT) - https://github.com/nihui/rife-ncnn-vulkan',
            'ncnn - neural network runtime (BSD-3-Clause) - https://github.com/Tencent/ncnn'
          )
          foreach ($p in 'ai\realesrgan\realesrgan-ncnn-vulkan.exe', 'ai\realesrgan\models\realesrgan-x4plus.bin',
                         'ai\rife\rife-ncnn-vulkan.exe', 'ai\rife\rife-v4.6') {
            if (-not (Test-Path $p)) { throw "AI add-on is missing $p" }
          }
          Compress-Archive -Path 'ai' -DestinationPath "FPV-DVR-Stitcher-$env:VER-AI-addon.zip" -Force
          Get-Item "FPV-DVR-Stitcher-$env:VER-AI-addon.zip" | Format-Table Name, Length

      - name: Self-test (detection, editing, chapters, lossless export, diagnostics, repair, enhance)
        run: python tests/smoke_test.py test_clips

      - uses: actions/download-artifact@v5
        with:
          name: FPV-DVR-Stitcher-models
          path: models_test

      - name: Build .exe (zip version, FFmpeg alongside)
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "FPV DVR Stitcher"
          --collect-binaries onnxruntime --hidden-import PIL._tkinter_finder
          fpv_dvr_stitcher.py

      - name: Build .exe (single-file version, FFmpeg built in)
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "FPV-DVR-Stitcher-${{ env.VER }}"
          --workpath build_standalone
          --collect-binaries onnxruntime --hidden-import PIL._tkinter_finder
          --add-binary "ffmpeg\ffmpeg.exe;ffmpeg" --add-binary "ffmpeg\ffprobe.exe;ffmpeg"
          fpv_dvr_stitcher.py

      - name: Assemble downloads
        run: |
          $pkg = "FPV-DVR-Stitcher-$env:VER"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item 'dist\FPV DVR Stitcher.exe', 'ffmpeg\ffmpeg.exe', 'ffmpeg\ffprobe.exe', 'README.txt' $pkg
          if (Test-Path 'ffmpeg\FFMPEG-LICENSE.txt') { Copy-Item 'ffmpeg\FFMPEG-LICENSE.txt' $pkg }
          Copy-Item 'ai' $pkg -Recurse
          Compress-Archive -Path $pkg -DestinationPath "FPV-DVR-Stitcher-$env:VER-windows.zip" -Force
          # the single-file .exe is tested from an empty folder so it must use its built-in FFmpeg
          New-Item -ItemType Directory -Force standalone | Out-Null
          Copy-Item "dist\FPV-DVR-Stitcher-$env:VER.exe" standalone
          Get-ChildItem "standalone\FPV-DVR-Stitcher-$env:VER.exe", "FPV-DVR-Stitcher-$env:VER-windows.zip", "FPV-DVR-Stitcher-$env:VER-AI-addon.zip" | Format-Table Name, Length

      - name: Test both .exe files (open, find FFmpeg, analyse, edit, play, export, enhance, run a model)
        env:
          FPV_MODEL_DIR: ${{ github.workspace }}\models_test
        run: |
          function Test-Exe([string]$exePath, [string]$name) {
            $report = Join-Path $PWD "selftest_$name.txt"
            $argList = @('--selftest', ('"' + $report + '"'))
            $argList += Get-ChildItem test_clips -Filter *.AVI | Sort-Object Name | ForEach-Object { '"' + $_.FullName + '"' }
            $t = Get-Date
            $p = Start-Process -FilePath $exePath -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit(600000)) {
              Get-Process 'FPV DVR Stitcher', "FPV-DVR-Stitcher-$env:VER" -ErrorAction SilentlyContinue | Stop-Process -Force
              throw "$name did not finish its self-test (crashed or hung)."
            }
            "--- $name finished in $([int]((Get-Date) - $t).TotalSeconds) s"
            if (-not (Test-Path $report)) { throw "$name did not write its self-test report." }
            Get-Content $report
            if (-not (Select-String -Path $report -Pattern 'SELFTEST OK' -Quiet)) { throw "$name failed its self-test." }
          }
          Test-Exe "FPV-DVR-Stitcher-$env:VER\FPV DVR Stitcher.exe" 'zip'
          Test-Exe "standalone\FPV-DVR-Stitcher-$env:VER.exe" 'single'
          if (-not (Select-String -Path 'selftest_single.txt' -Pattern '^ffmpeg: .*_MEI' -Quiet)) {
            throw 'The single-file .exe did not use its built-in FFmpeg.'
          }
          if (-not (Select-String -Path 'selftest_zip.txt' -Pattern '^AI add-on: found' -Quiet)) {
            throw 'The zip version did not find its AI add-on.'
          }
          foreach ($n in 'zip', 'single') {
            if (-not (Select-String -Path "selftest_$n.txt" -Pattern '^clean-up model: ok' -Quiet)) {
              throw "The $n .exe could not run the clean-up model (ONNX Runtime)."
            }
          }

      - uses: actions/upload-artifact@v5
        with:
          name: FPV-DVR-Stitcher-${{ env.VER }}-single-exe
          path: standalone/FPV-DVR-Stitcher-${{ env.VER }}.exe

      - uses: actions/upload-artifact@v5
        with:
          name: FPV-DVR-Stitcher-${{ env.VER }}-windows
          path: FPV-DVR-Stitcher-${{ env.VER }}/

      - uses: actions/upload-artifact@v5
        with:
          name: FPV-DVR-Stitcher-${{ env.VER }}-AI-addon
          path: ai/

      - name: Attach downloads to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "standalone\FPV-DVR-Stitcher-${{ env.VER }}.exe" "FPV-DVR-Stitcher-${{ env.VER }}-windows.zip"
          "FPV-DVR-Stitcher-${{ env.VER }}-AI-addon.zip"
          --clobber --repo "${{ github.repository }}"
