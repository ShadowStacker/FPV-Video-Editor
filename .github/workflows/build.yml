name: Build Windows app

# Every push to main builds and tests the .exe (download it from the run's
# "Artifacts"). Pushing a version tag such as v1.0.1 also publishes it as a
# GitHub Release with the ready-to-use zip attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the zip to a Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip' -OutFile ffmpeg_dl.zip
          Expand-Archive ffmpeg_dl.zip -DestinationPath ffmpeg_dl
          $exe = Get-ChildItem -Recurse ffmpeg_dl -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item $exe.FullName, (Join-Path $exe.DirectoryName 'ffprobe.exe') ffmpeg
          $lic = Get-ChildItem -Recurse ffmpeg_dl -Filter 'LICENSE*' | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName 'ffmpeg\FFMPEG-LICENSE.txt' }
          .\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Self-test (static detection + lossless export)
        run: python tests/smoke_test.py test_clips

      - name: Build .exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "FPV DVR Stitcher" fpv_dvr_stitcher.py

      - name: Assemble download folder
        run: |
          $pkg = 'FPV-DVR-Stitcher'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item 'dist\FPV DVR Stitcher.exe', 'ffmpeg\ffmpeg.exe', 'ffmpeg\ffprobe.exe', 'README.txt' $pkg
          if (Test-Path 'ffmpeg\FFMPEG-LICENSE.txt') { Copy-Item 'ffmpeg\FFMPEG-LICENSE.txt' $pkg }
          Get-ChildItem $pkg | Format-Table Name, Length

      - name: Test the built .exe (opens, finds FFmpeg, analyses + exports)
        run: |
          $report = Join-Path $PWD 'selftest.txt'
          $argList = @('--selftest', ('"' + $report + '"'))
          $argList += Get-ChildItem test_clips -Filter *.AVI | Sort-Object Name | ForEach-Object { '"' + $_.FullName + '"' }
          $p = Start-Process -FilePath 'FPV-DVR-Stitcher\FPV DVR Stitcher.exe' -ArgumentList $argList -PassThru
          if (-not $p.WaitForExit(180000)) {
            Get-Process 'FPV DVR Stitcher' -ErrorAction SilentlyContinue | Stop-Process -Force
            throw 'The built .exe did not finish its self-test (crashed or hung).'
          }
          if (-not (Test-Path $report)) { throw 'The built .exe did not write its self-test report.' }
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern 'SELFTEST OK' -Quiet)) { throw 'The built .exe failed its self-test.' }

      - name: Zip
        run: Compress-Archive -Path FPV-DVR-Stitcher -DestinationPath FPV-DVR-Stitcher-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FPV-DVR-Stitcher-windows
          path: FPV-DVR-Stitcher/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FPV-DVR-Stitcher-windows.zip
          body: |
            **Download `FPV-DVR-Stitcher-windows.zip` below**, unzip it anywhere and run `FPV DVR Stitcher.exe`.
            Keep `ffmpeg.exe` and `ffprobe.exe` in the same folder. No install or Python needed.

            Windows SmartScreen may warn the first time (the .exe isn't code-signed): click **More info -> Run anyway**.
